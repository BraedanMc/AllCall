# Local workstation site config (no HPC scratch paths).
# Copy: cp config/local.config.yaml site.config.yaml
# Or pass this path to ./bin/setup.sh, ./bin/check.sh, ./bin/run_cohort.sh --config ...
scratch_root: scratch
work_dirs:
  viralintegration: nfVI
  sarek_sv: nfSarekSV
  sarek_snp: nfSarekSNP
  viralmetagenome: nfVirMeta
# Place FASTQs under data/ (see samplesheets/cohort.local.example) or edit the sheet.
samplesheet: samplesheets/cohort.local.example
results_dir: results
pipelines:
  viralintegration:
    enabled: true
  sarek:
    enabled: true
    tools_sv: manta
    tools_snp: haplotypecaller
  viralmetagenome:
    enabled: true
container_profile: docker
sex_xy_min_ratio: 0.1
nextflow_configs:
  - config/nextflow/local.config
