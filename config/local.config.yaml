# Local workstation site config (no HPC scratch paths).
# Copy: cp config/local.config.yaml site.config.yaml
# Or pass this path to ./bin/setup.sh, ./bin/check.sh, ./bin/run_cohort.sh --config ...
# scratch_root: ~ and $HOME/... are expanded by bin/lib.sh (see expand_user_path).
scratch_root: ~/Documents/projects/allcall/scratch
work_dirs:
  viralintegration: nfVI
  sarek_sv: nfSarekSV
  sarek_snp: nfSarekSNP
  viralmetagenome: nfVirMeta
# FASTQs: repo-relative paths under data/ (see samplesheets/cohort.local.example).
samplesheet: samplesheets/cohort.local.example
# Cohort outputs (matrix, BAMs, sheets) stay in the clone; Nextflow -work-dir uses scratch_root.
results_dir: results
pipelines:
  viralintegration:
    enabled: true
  sarek:
    enabled: true
    tools_sv: manta
    tools_snp: haplotypecaller
  viralmetagenome:
    enabled: true
# Mac / Docker Desktop: docker. Linux HPC: container_profile: apptainer
container_profile: docker
sex_xy_min_ratio: 0.1
nextflow_configs:
  - config/nextflow/local.config
