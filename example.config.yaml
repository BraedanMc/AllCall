# human (hg38) or mouse (mm39); reference URLs and paths come from config/pin.yaml species.*
species: human
# small_host: false  # true on RAM-limited Macs: requires ref/vi_star from ./bin/hpc_build_vi_star_indices.sh on HPC (see docs/local-mac-runbook.md).
scratch_root: /scratch.global/bmcc
work_dirs:
  viralintegration: nfVI
  sarek_sv: nfSarekSV
  sarek_snp: nfSarekSNP
  viralmetagenome: nfVirMeta
samplesheet: samplesheets/cohort.csv
results_dir: results
pipelines:
  viralintegration:
    enabled: true
  sarek:
    enabled: true
    tools_sv: manta
    tools_snp: haplotypecaller
  viralmetagenome:
    enabled: true
container_profile: apptainer
sex_xy_min_ratio: 0.1
nextflow_configs: []
