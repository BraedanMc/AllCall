name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3 curl
          # pin.yaml targets mikefarah yq (conda tool_yq); Ubuntu's apt yq is a different implementation.
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
      - run: chmod +x bin/*.sh tests/*.sh
      - run: |
          ./tests/smoke.sh
          ./tests/test_config_merge.sh
          ./tests/test_local_config.sh
          ./tests/test_setup_skip_kraken.sh
          ./tests/test_write_sheets_validation.sh
          ./tests/test_virus_merge.sh
          ./tests/test_references_check.sh
          ./tests/test_cds_bed.sh
          ./tests/test_cohort_snp_gate.sh
          ./tests/test_expand_user_path.sh
          ./tests/test_nf_apptainer_overlay.sh
