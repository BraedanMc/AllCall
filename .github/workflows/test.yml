name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yq python3
      - run: chmod +x bin/*.sh tests/*.sh
      - run: |
          ./tests/smoke.sh
          ./tests/test_config_merge.sh
          ./tests/test_write_sheets_validation.sh
          ./tests/test_virus_merge.sh
          ./tests/test_references_check.sh
